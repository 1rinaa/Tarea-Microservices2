<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Micro Frontends</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #05070d;
      --surface: rgba(15, 20, 35, 0.55);
      --surface-hover: rgba(25, 32, 52, 0.75);
      --border: rgba(80, 120, 255, 0.12);
      --border-hover: rgba(100, 150, 255, 0.35);
      --text: #e6ecff;
      --text-dim: #7a8bb0;
      --accent: #4d7cff;
      --accent-glow: rgba(77, 124, 255, 0.4);
    }

    html, body {
      min-height: 100vh;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
      overflow-x: hidden;
      position: relative;
    }

    ::-webkit-scrollbar {
    width: 10px;
    height: 10px;
    }

    ::-webkit-scrollbar-track {
    background: #05070d;
    }

    ::-webkit-scrollbar-thumb {
    background: rgba(80, 120, 255, 0.25);
    border-radius: 5px;
    border: 2px solid #05070d;
    background-clip: padding-box;
    transition: background 0.2s;
    }

    ::-webkit-scrollbar-thumb:hover {
    background: rgba(80, 120, 255, 0.55);
    background-clip: padding-box;
    }

    ::-webkit-scrollbar-corner {
    background: #05070d;
    }

    html {
    scrollbar-color: rgba(80, 120, 255, 0.4) #05070d;
    scrollbar-width: thin;
    }

    /* Aura azul idéntica al home */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(ellipse 800px 600px at 15% 10%, rgba(45, 90, 255, 0.15), transparent 60%),
        radial-gradient(ellipse 700px 500px at 85% 85%, rgba(0, 180, 255, 0.10), transparent 60%),
        radial-gradient(ellipse 900px 700px at 50% 50%, rgba(20, 40, 120, 0.08), transparent 70%),
        #05070d;
      pointer-events: none;
    }

    .shell {
      max-width: 1240px;
      margin: 0 auto;
      position: relative;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 4px 24px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-mark {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, #1e3a8a, #4d7cff);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 24px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,0.15);
      flex-shrink: 0;
    }

    .brand-mark svg { width: 22px; height: 22px; color: white; }

    .brand-text h1 {
      font-size: 1.05em;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #ffffff;
    }

    .brand-text p {
      font-size: 0.72em;
      color: var(--text-dim);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-top: 3px;
    }

    .meta {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 0.8em;
      color: var(--text-dim);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.7);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Nav */
    .nav {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      padding: 6px;
      background: rgba(15, 20, 35, 0.5);
      border: 1px solid var(--border);
      border-radius: 14px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      margin-bottom: 16px;
    }

    .nav button {
      flex: 1 1 auto;
      min-width: 110px;
      font-family: inherit;
      font-size: 0.85em;
      font-weight: 500;
      padding: 11px 18px;
      border: 1px solid transparent;
      border-radius: 10px;
      background: transparent;
      color: var(--text-dim);
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      letter-spacing: 0.01em;
    }

    .nav button svg {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
      transition: transform 0.25s;
    }

    .nav button:hover {
      color: var(--text);
      background: var(--surface-hover);
      border-color: var(--border-hover);
    }

    .nav button:hover svg { transform: scale(1.1); }

    .nav button.active {
      color: white;
      background: linear-gradient(135deg, rgba(77, 124, 255, 0.9), rgba(30, 58, 138, 0.9));
      border-color: rgba(120, 160, 255, 0.5);
      box-shadow: 0 0 0 1px rgba(120, 160, 255, 0.2),
                  0 8px 24px rgba(77, 124, 255, 0.3),
                  inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }

    /* Frame */
    .frame-wrapper {
      background: rgba(15, 20, 35, 0.4);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      height: calc(100vh - 260px);
      min-height: 460px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5),
                  inset 0 1px 0 rgba(255, 255, 255, 0.04);
      position: relative;
    }

    .frame-wrapper::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(120, 160, 255, 0.3), transparent);
      z-index: 2;
      pointer-events: none;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #05070d;
      border-radius: 14px;
    }

    /* Footer */
    .footer {
      text-align: center;
      color: var(--text-dim);
      padding: 24px 0 8px;
      font-size: 0.78em;
      letter-spacing: 0.03em;
    }

    @media (max-width: 720px) {
      body { padding: 12px; }
      .header { padding: 12px 4px 20px; flex-direction: column; align-items: flex-start; gap: 12px; }
      .nav button { min-width: 0; padding: 10px 12px; font-size: 0.78em; }
      .nav button svg { display: none; }
      .frame-wrapper { height: calc(100vh - 240px); }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="header">
      <div class="brand">
        <div class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>Micro Frontends</h1>
          <p>Tarea 3 · Composición por iFrames</p>
        </div>
      </div>
      <div class="meta">
        <div class="status">
          <span class="status-dot"></span>
          <span>Todos los servicios activos</span>
        </div>
      </div>
    </header>

    <nav class="nav">
      <button data-url="home.html" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span class="label">Home</span>
      </button>
      <button data-url="https://books-minifront.vercel.app">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        </svg>
        <span class="label">Books</span>
      </button>
      <button data-url="https://authors-minifront.vercel.app">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span class="label">Authors</span>
      </button>
      <button data-url="https://publishers-minifront.vercel.app">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="2" width="16" height="20" rx="2"/>
          <path d="M9 22v-4h6v4"/>
          <path d="M8 6h.01M16 6h.01M12 6h.01M12 10h.01M12 14h.01M16 10h.01M16 14h.01M8 10h.01M8 14h.01"/>
        </svg>
        <span class="label">Publishers</span>
      </button>
      <button data-url="https://reviews-minifront.vercel.app">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
        </svg>
        <span class="label">Reviews</span>
      </button>
    </nav>

    <div class="frame-wrapper">
      <iframe id="iframe" src="home.html" title="Micro frontend"></iframe>
    </div>

    <footer class="footer">
      © 2026 Irina Rivera · Arquitectura de micro-frontends
    </footer>
  </div>

  <script>
    const iframe = document.getElementById('iframe');
    const buttons = document.querySelectorAll('.nav button');

    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        iframe.src = btn.dataset.url;
      });
    });
  </script>
</body>
</html>
