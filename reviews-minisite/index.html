<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Reviews Example Site</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="css/skeleton.css">
</head>
<body>
  <div class="container" style="margin-top: 5%">
    <h3>Reviews</h3>
    <p id="subtitle">Loading reviews...</p>

    <review-list></review-list>

    <h5 style="margin-top: 30px">Add a review</h5>
    <review-form></review-form>
  </div>

  <script>
    const reviewsApi = 'https://reviews-microservice.netlify.app';  // ← REEMPLAZAR

    // Leer ?bookId= de la URL
    const params = new URLSearchParams(location.search);
    const bookIdFromUrl = params.get('bookId');

    // ------------------------------------------------------------------
    // Componente: <review-list>
    // ------------------------------------------------------------------
    class ReviewList extends HTMLElement {
      connectedCallback() {
        this.attachShadow({ mode: 'open' });
        this.shadowRoot.innerHTML = `
          <style>
            ul { list-style: none; padding-left: 0; }
            li {
              border: 1px solid #ddd;
              border-radius: 5px;
              padding: 10px 15px;
              margin-bottom: 10px;
              background: #fafafa;
            }
            .header { display: flex; justify-content: space-between; margin-bottom: 5px; }
            .user { font-weight: bold; }
            .stars { color: #f5a623; }
            .date { color: #888; font-size: 0.85em; }
            .empty { color: #666; font-style: italic; }
          </style>
          <div id="content">Loading...</div>
        `;
        this.loadReviews();
      }

      async loadReviews() {
        try {
          let url = reviewsApi + '/api/reviews';
          if (bookIdFromUrl) url += '?bookId=' + bookIdFromUrl;

          const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
          const reviews = await res.json();

          const content = this.shadowRoot.getElementById('content');

          if (!reviews.length) {
            content.innerHTML = '<p class="empty">No reviews yet.</p>';
            return;
          }

          content.innerHTML = `
            <ul>
              ${reviews.map(r => `
                <li>
                  <div class="header">
                    <span class="user">${this.escape(r.user_name)}</span>
                    <span class="date">${new Date(r.created_at).toLocaleDateString()}</span>
                  </div>
                  <div class="stars">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</div>
                  <div>${this.escape(r.text || '')}</div>
                </li>
              `).join('')}
            </ul>
          `;
        } catch (err) {
          this.shadowRoot.getElementById('content').innerHTML =
            '<p class="empty">Error loading reviews: ' + err.message + '</p>';
        }
      }

      escape(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }
    }
    customElements.define('review-list', ReviewList);

    // ------------------------------------------------------------------
    // Componente: <review-form>
    // ------------------------------------------------------------------
    class ReviewForm extends HTMLElement {
      connectedCallback() {
        this.attachShadow({ mode: 'open' });
        this.shadowRoot.innerHTML = `
          <style>
            form { display: flex; flex-direction: column; gap: 10px; max-width: 500px; }
            label { font-weight: bold; font-size: 0.9em; }
            input, textarea, select {
              width: 100%; padding: 8px;
              border: 1px solid #ccc; border-radius: 4px;
              font-size: 1em; font-family: inherit;
            }
            button {
              padding: 10px 20px; background: #33c3f0; color: white;
              border: none; border-radius: 4px; cursor: pointer;
              font-size: 1em; font-weight: bold;
            }
            button:hover { background: #1eaedb; }
            .msg { font-size: 0.9em; margin-top: 5px; }
            .msg.ok { color: green; }
            .msg.err { color: red; }
          </style>
          <form id="form">
            <div>
              <label for="user">Your name</label>
              <input type="text" id="user" required>
            </div>
            <div>
              <label for="rating">Rating</label>
              <select id="rating" required>
                <option value="5">★★★★★ (5)</option>
                <option value="4">★★★★☆ (4)</option>
                <option value="3">★★★☆☆ (3)</option>
                <option value="2">★★☆☆☆ (2)</option>
                <option value="1">★☆☆☆☆ (1)</option>
              </select>
            </div>
            <div>
              <label for="text">Comment</label>
              <textarea id="text" rows="3"></textarea>
            </div>
            <button type="submit">Submit review</button>
            <div class="msg" id="msg"></div>
          </form>
        `;

        this.shadowRoot.getElementById('form').addEventListener('submit', (e) => this.submit(e));
      }

      async submit(e) {
        e.preventDefault();
        const msg = this.shadowRoot.getElementById('msg');
        msg.textContent = 'Sending...';
        msg.className = 'msg';

        const body = {
          bookId: bookIdFromUrl ? parseInt(bookIdFromUrl) : null,
          user: this.shadowRoot.getElementById('user').value.trim(),
          rating: parseInt(this.shadowRoot.getElementById('rating').value),
          text: this.shadowRoot.getElementById('text').value.trim()
        };

        if (!body.bookId) {
          msg.textContent = 'Falta el bookId en la URL (?bookId=1)';
          msg.className = 'msg err';
          return;
        }

        try {
          const res = await fetch(reviewsApi + '/api/reviews', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          });
          if (!res.ok) throw new Error('HTTP ' + res.status);

          msg.textContent = '✓ Review submitted!';
          msg.className = 'msg ok';
          this.shadowRoot.getElementById('form').reset();

          // Recargar la lista
          document.querySelector('review-list').shadowRoot.innerHTML = 'Reloading...';
          document.querySelector('review-list').loadReviews();
        } catch (err) {
          msg.textContent = 'Error: ' + err.message;
          msg.className = 'msg err';
        }
      }
    }
    customElements.define('review-form', ReviewForm);

    // ------------------------------------------------------------------
    // Subtítulo dinámico
    // ------------------------------------------------------------------
    if (bookIdFromUrl) {
      document.getElementById('subtitle').textContent = 'Reviews for book #' + bookIdFromUrl;
    } else {
      document.getElementById('subtitle').textContent = 'All reviews';
    }
  </script>
</body>
</html>
